{
    "Module Type":           "Noise Dependent Volume Control",

    "bypass"        : false,
    //
    // "mode"  selects between three different modes of operation for the NDVC feature.
    // Eeach mode selects a different noise level as the "reference" for volume adaptation:
    // 0: Initial noise level (noise floor estimate when feature starts at runtime)
    // 1: Nominal quiet level ("nominalQuietLevel" parameter below)
    // 2: Noise level at the time the user changes volume
    //
    "mode"               : 1,
    //
    // Noise tracking parameters
    //
    "attackTime"         : 4.0, // sec
    "releaseTime"        : 0.1, // sec
    "shortAttackTime"    : 2.0, // sec
    "attackHoldTime"     : 2.0, // sec
    "minNoiseFreq"       : 400.0, // Hz
    "maxNoiseFreq"       : 8000.0, // Hz
    //
    // Volume control parameters
    //
    "volumeHoldTime"     : 0.75, // sec
    "volumeHysteresisTime" : 2.0, // sec
     "nominalQuietLevel"  : -75.0, // dB
    "minVolume"          : 0, // min bound for adapted volume index
    "maxVolume"          : 100, // max bound for adapted volume index
    "maxGainStep"        : 5.0, // dB, max level increment a single volume change can produce
    "voipFarEndSNRThresh" : 0.0, // dB, SNR threshold to detect VoIP far-end voice activity
    "voipFarEndPauseMaxDuration"    : 2.0, // sec
    //
    // sensitivityFactor  is used to scale up/down the sensitivity table below
    // This paramater can be controlled from a "sensitivity" slider in the Alexa app
    //
    "sensitivityFactor"  : 1.0,
    //
    // Sensitivity per volume index, for volume 1-10
    // These tuned values are the slope of the volume-vs-noise mapping function,
    // i.e. (volumeDelta_dB / noiseDelta_dB), for each volume step.
    //
    "sensitivityTable"        :
        [ 1.0, 1.0, 1.0, 1.0, 0.8, 0.6, 0.4, 0.2, 0.1, 0.0 ],
    //
    // Volume curves
    //
    "voip_volTab"        :
        [ //shall be kept matching "voiceCallVolTable" in "mod_VOIP_RxFullbandAGC.cfg"
          //shall be also kept matching MM volume curve in "audio_policy_engine_default_stream_volumes.xml"
        -200.0,                                  // volume   0
       -33.0,  -31.0,  -29.0,  -27.5,   -26.0,  // volumes  1 to  5
       -23.5,  -21.5,  -19.0,  -17.5,   -15.5,  // volumes  6 to 10
       -14.0,  -13.0,  -11.0,  -10.0,    -9.0,  // volumes 11 to 15
        -8.0,   -7.0,   -6.0,   -5.0,    -4.0,  // volumes 16 to 20
        -3.0,   -2.0,   -1.0,   -0.5,     0.0   // volumes 21 to 25
        ],
    "music_volTab"        :
        [
        -200, -40, -38, -36, -34, -32, -30, -28, -26, -24,
        -22, -20, -18, -16, -14, -12, -11, -9, -8, -6,
        -5, -4, -3, -2, -1, 0
        ],
    "TTS_volTab"        :
        [
        -200, -40, -38, -36, -34, -32, -30, -28, -26, -24,
        -22, -20, -18, -16, -14, -12, -11, -9, -8, -6,
        -5, -4, -3, -2, -1, 0
        ],
    "default_volTab"        :
        [
        -200, -40, -38, -36, -34, -32, -30, -28, -26, -24,
        -22, -20, -18, -16, -14, -12, -11, -9, -8, -6,
        -5, -4, -3, -2, -1, 0
        ]
}