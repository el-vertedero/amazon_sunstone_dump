[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF]
thermal_zone= soc_max
mode= enabled
policy= power_allocator
switch_on_temp= 80000
control_temp= 85000
critical_temp= 103000

[LTF]
thermal_zone= charge_ntc
mode= enabled
policy= step_wise

[LTF]
thermal_zone= ap_ntc
mode= enabled
policy= step_wise

[LTF]
thermal_zone= pm6365_ntc
mode= enabled
policy= step_wise

[LTF]
thermal_zone= sdcard_ntc
mode= enabled
policy= step_wise

[LTF]
thermal_zone= mtk-master-charger
mode= enabled
policy= step_wise

[LTF]
thermal_zone= pmic_temp
mode= enabled
policy= step_wise

[LTF]
thermal_zone= battery
mode= enabled
policy= step_wise

[LTF]
thermal_zone= consys
mode= enabled
policy= step_wise

[mtk-cpu-table-mapping]
mode= enabled
sensor= soc_max
cluster= 0
threshold= [90000, 92500, 95000]
hysteresis= [4999, 4999, 4999]
freq= [939000, 746000, 500000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= soc_max
cluster= 1
threshold= [90000, 92500, 95000]
hysteresis= [4999, 4999, 4999]
freq= [1063000, 856000, 650000]

[mtk-gpu-table-mapping]
mode= enabled
sensor= soc_max
threshold= [90000, 92500, 95000]
hysteresis= [4999, 4999, 4999]
freq= [556000, 473000, 390000]